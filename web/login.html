<!doctype html>
<!-- Author: donglixiao · memoir-tv account entry. -->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>登录 · memoir-tv</title>
    <link rel="icon" href="./assets/mark.svg" />
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/access.css" />
    <link rel="stylesheet" href="./styles/compat.css" />
    <script defer src="./js/boot.js" data-entry="login"></script>
  </head>
  <body class="access-page">
    <main class="login-shell">
      <section class="login-story">
        <a class="access-brand" href="./"><img src="./assets/mark.svg" alt="" />memoir-tv</a>
        <span class="access-eyebrow">THE PEOPLE WE KEEP CLOSE</span>
        <h1>推开门，<br />回到我们的日子。</h1>
        <p>那些平常的瞬间，<br />留给最亲近的人，慢慢重温。</p>
        <img class="login-art" src="./assets/memories.svg" alt="相片里的山与暖阳" />
        <small>每一段回忆，都有自己的归属。</small>
      </section>
      <section class="login-card" aria-labelledby="entry-title">
        <span class="access-eyebrow">YOUR FAMILY SPACE</span>
        <h2 id="entry-title">欢迎回家</h2>
        <p id="entry-hint">登录后，继续翻阅属于你的回忆。</p>
        <nav class="access-tabs" aria-label="账号入口">
          <button id="login-tab" aria-pressed="true">登录</button
          ><button id="register-tab" hidden>注册账号</button>
        </nav>
        <form id="entry-form">
          <label id="setup-field" hidden
            >本机初始化码<input name="code" autocomplete="off" maxlength="128" /><small
              >从素材电脑的数据目录 security/setup-code.txt 读取；仅首次创建管理员需要。</small
            ></label
          >
          <label
            >用户名<input
              name="username"
              autocomplete="username"
              required
              minlength="3"
              maxlength="32"
              placeholder="你的账号名称"
          /></label>
          <label
            >密码<input
              name="password"
              type="password"
              autocomplete="current-password"
              required
              maxlength="128"
              placeholder="输入密码"
          /></label>
          <label id="phone-field" hidden
            >手机号 <small>可选，仅管理员可见</small
            ><input name="phone" type="tel" autocomplete="tel" maxlength="24"
          /></label>
          <p id="password-hint" class="access-note" hidden>
            密码为 12–128 位，至少包含字母和数字。
          </p>
          <p id="entry-message" class="access-message" role="status" aria-live="polite"></p>
          <button class="access-primary" type="submit">进入回忆</button>
        </form>
        <p class="access-note">此浏览器会记住登录状态。共用设备使用完毕后，请退出账号。</p>
      </section>
    </main>
  </body>
</html>
